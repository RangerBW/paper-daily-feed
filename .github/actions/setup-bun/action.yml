name: Setup Bun project
description: Install the pinned Bun runtime and locked dependencies.

runs:
  using: composite
  steps:
    - name: Setup Bun
      id: setup
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
      run: bun ci
