name: Setup Bun project
description: Install the pinned Bun runtime and locked dependencies.

runs:
  using: composite
  steps:
    - name: Install Bun
      shell: bash
      run: npm install -g bun@1.3.14

    - name: Install dependencies
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
      run: bun ci
