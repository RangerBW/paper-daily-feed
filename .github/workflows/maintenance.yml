name: Repository maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "37 21 * * 0"

permissions:
  contents: write

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: nehSgnaiL/paper-daily-feed
  MAINTENANCE_BRANCH: paper-daily-feed-maintenance

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Keep scheduled workflows active
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin "${MAINTENANCE_BRANCH}" || true

          if git show-ref --verify --quiet "refs/remotes/origin/${MAINTENANCE_BRANCH}"; then
            git switch -C "${MAINTENANCE_BRANCH}" "origin/${MAINTENANCE_BRANCH}"
          else
            git switch -c "${MAINTENANCE_BRANCH}"
          fi

          git commit --allow-empty -m "ci: keep scheduled workflows active"
          git push origin "${MAINTENANCE_BRANCH}"

  sync:
    if: ${{ github.repository != 'nehSgnaiL/paper-daily-feed' }}
    needs: keepalive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Sync fork from upstream
        env:
          SYNC_TOKEN: ${{ secrets.MAINTENANCE_SYNC_TOKEN || github.token }}
          CAN_SYNC_WORKFLOW_FILES: ${{ secrets.MAINTENANCE_SYNC_TOKEN != '' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags origin main
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          git switch -C main origin/main

          sync_paths=(.)
          if [ "${CAN_SYNC_WORKFLOW_FILES}" != "true" ]; then
            sync_paths=(. ':(exclude).github/workflows/**')
          fi

          write_workflow_sync_steps() {
            echo "To also sync workflow files:"
            echo "1. Open https://github.com/settings/personal-access-tokens/new"
            echo "2. Create a fine-grained token scoped to this fork with Contents and Workflows read/write."
            echo "3. Open https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions/new"
            echo "4. Save the token as an Actions secret named MAINTENANCE_SYNC_TOKEN."
          }

          if git diff --quiet HEAD upstream/main -- "${sync_paths[@]}"; then
            {
              echo "### Auto-sync checked"
              echo
              if [ "${CAN_SYNC_WORKFLOW_FILES}" = "true" ]; then
                echo "The fork main branch already contains \`${UPSTREAM_REPOSITORY}:main\`."
              else
                echo "The fork main branch already contains the non-workflow files from \`${UPSTREAM_REPOSITORY}:main\`."
              fi
              if [ "${CAN_SYNC_WORKFLOW_FILES}" != "true" ] && ! git diff --quiet HEAD upstream/main -- .github/workflows; then
                echo
                echo "Workflow file updates exist upstream but were not applied automatically because GitHub blocks workflow-file pushes from this workflow token."
                echo
                write_workflow_sync_steps
              fi
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "${CAN_SYNC_WORKFLOW_FILES}" != "true" ] && ! git diff --quiet HEAD upstream/main -- .github/workflows; then
              echo "::warning title=Workflow updates skipped::Open https://github.com/settings/personal-access-tokens/new to create the token, then add it at https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions/new as MAINTENANCE_SYNC_TOKEN."
            fi

            exit 0
          fi

          if ! git merge --squash upstream/main; then
            git restore --source=HEAD --staged --worktree .github/workflows || true

            if git diff --name-only --diff-filter=U | grep -q .; then
              git merge --abort || true
              {
                echo "### Auto-sync skipped"
                echo
                echo "The fork main branch and \`${UPSTREAM_REPOSITORY}:main\` both changed, and Git could not merge them automatically."
                echo "No updates were pushed to \`main\`."
                echo
                echo "Resolve the conflicts manually, then rerun this workflow."
              } >> "$GITHUB_STEP_SUMMARY"

              echo "::warning title=Auto-sync skipped::Upstream changes could not be merged automatically."
              exit 0
            fi
          fi

          if [ "${CAN_SYNC_WORKFLOW_FILES}" != "true" ] && ! git diff --quiet --cached -- .github/workflows; then
            git restore --source=HEAD --staged --worktree .github/workflows
            {
              echo "### Workflow updates skipped"
              echo
              echo "Workflow file updates from \`${UPSTREAM_REPOSITORY}:main\` were not applied automatically because GitHub blocks workflow-file pushes from this workflow token."
              echo
              write_workflow_sync_steps
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::warning title=Workflow updates skipped::Open https://github.com/settings/personal-access-tokens/new to create the token, then add it at https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions/new as MAINTENANCE_SYNC_TOKEN."
          fi

          if git diff --cached --quiet; then
            git merge --abort || true
            {
              echo "### Auto-sync skipped"
              echo
              echo "Only workflow file updates were available from \`${UPSTREAM_REPOSITORY}:main\`."
              echo "No updates were pushed to \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          npm ci
          npm run build
          npm run test:email
          npm test

          git commit -m "chore: sync upstream main"
          git push origin main

          {
            echo "### Auto-sync completed"
            echo
            echo "The fork main branch was updated from \`${UPSTREAM_REPOSITORY}:main\` after verification passed."
            if [ "${CAN_SYNC_WORKFLOW_FILES}" = "true" ]; then
              echo "Workflow files were included because \`MAINTENANCE_SYNC_TOKEN\` is configured."
            else
              echo "Workflow files are preserved from the fork."
              echo
              write_workflow_sync_steps
            fi
          } >> "$GITHUB_STEP_SUMMARY"
